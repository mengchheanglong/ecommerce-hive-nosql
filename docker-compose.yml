version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # 1. MongoDB - Document Store (Product Catalog & Customer Profiles)
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:8.0
    container_name: marketplace-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ecommerce
    volumes:
      - mongo_data:/data/db

  # ---------------------------------------------------------------------------
  # 2. Redis - In-Memory Key-Value (Active Carts & Session Cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # ---------------------------------------------------------------------------
  # 3. Apache Cassandra - Column-Family (Rider GPS Telemetry - 13.8M rows/day)
  # ---------------------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: marketplace-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=marketplace_cluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    volumes:
      - cassandra_data:/var/lib/cassandra

  # ---------------------------------------------------------------------------
  # 4. Neo4j - Graph Database (3-Level Referral Reward Network)
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.18-community
    container_name: marketplace-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/marketplace2026
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  # ---------------------------------------------------------------------------
  # 5. Marketplace Full-Stack Application (Next.js 15 App Router)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: marketplace-web
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=ecommerce
      - REDIS_URL=redis://redis:6379
      - CASSANDRA_HOST=cassandra
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:
  redis_data:
  cassandra_data:
  neo4j_data:
