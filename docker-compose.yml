version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # 1. MongoDB - Document Store (Product Catalog, Customer Profiles & Orders)
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:8.0
    container_name: marketplace-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ecommerce
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 2. Redis - In-Memory Key-Value (Active Carts & Session Cache)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: marketplace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s

  # ---------------------------------------------------------------------------
  # 3. Apache Cassandra - Column-Family (Rider GPS Telemetry - 13.8M rows/day)
  # ---------------------------------------------------------------------------
  cassandra:
    image: cassandra:4.1
    container_name: marketplace-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=marketplace_cluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_RACK=rack1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    volumes:
      - cassandra_data:/var/lib/cassandra

  # ---------------------------------------------------------------------------
  # 4. Neo4j - Graph Database (3-Level Referral Reward Network)
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.18-community
    container_name: marketplace-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/marketplace2026
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=128M
      - NEO4J_dbms_memory_heap_initial__size=256M
      - NEO4J_dbms_memory_heap_max__size=512M
    volumes:
      - neo4j_data:/data

  # ---------------------------------------------------------------------------
  # 5. NestJS Microservices Backend (Port 8400, Swagger Docs at /api/docs)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketplace-backend
    restart: unless-stopped
    ports:
      - "8400:8400"
    environment:
      - NODE_ENV=production
      - PORT=8400
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=ecommerce
      - REDIS_URL=redis://redis:6379
      - CASSANDRA_HOST=cassandra
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 6. Marketplace Full-Stack Application (Next.js 15 App Router - Port 8401)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: marketplace-web
    restart: unless-stopped
    ports:
      - "8401:8401"
    environment:
      - NODE_ENV=production
      - PORT=8401
      - INTERNAL_API_URL=http://backend:8400
      - NEXT_PUBLIC_API_URL=http://localhost:8400
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=ecommerce
      - REDIS_URL=redis://redis:6379
      - CASSANDRA_HOST=cassandra
      - NEO4J_URI=bolt://neo4j:7687
    depends_on:
      backend:
        condition: service_started
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
  cassandra_data:
  neo4j_data:
