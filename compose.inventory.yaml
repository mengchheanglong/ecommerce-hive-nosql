# Opt-in transaction support for the reference marketplace. No volume recreation.
# docker compose -f docker-compose.yml -f compose.inventory.yaml up -d
services:
  mongodb:
    command: ["mongod", "--replSet", "marketplace_inventory", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  inventory-replica-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mongosh --host mongodb --quiet --eval 'db.adminCommand({ping:1})'; do sleep 1; done
        mongosh --host mongodb --quiet --eval '
          try {
            const status = rs.status();
            if (status.set !== "marketplace_inventory") throw new Error("Unexpected replica set; reconcile manually");
          } catch (error) {
            if (error.codeName !== "NotYetInitialized") throw error;
            rs.initiate({_id:"marketplace_inventory",members:[{_id:0,host:"mongodb:27017"}]});
          }
        '

  backend:
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/?replicaSet=marketplace_inventory
    depends_on:
      inventory-replica-init:
        condition: service_completed_successfully
